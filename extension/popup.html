<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kookie</title>
    <link rel="stylesheet" href="src/popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Kookie</h1>
          <p id="statusText">Ready</p>
        </div>
        <button id="assetButton" class="secondary" type="button">Assets</button>
      </header>

      <section class="controls" aria-label="Reader controls">
        <button id="playButton" class="primary" type="button" title="Play">Play</button>
        <button id="pauseButton" type="button" title="Pause">Pause</button>
        <button id="resumeButton" type="button" title="Resume">Resume</button>
        <button id="stopButton" class="danger" type="button" title="Stop">Stop</button>
      </section>

      <textarea id="readerText" spellcheck="true" placeholder="Paste text or import the current selection."></textarea>

      <section class="settings" aria-label="Voice settings">
        <label>
          <span>Voice</span>
          <select id="voiceSelect">
            <option value="af_sarah">af_sarah</option>
          </select>
        </label>
        <label>
          <span>Rate</span>
          <input id="rateInput" type="range" min="0.5" max="2" step="0.05">
          <output id="rateValue"></output>
        </label>
        <label>
          <span>Volume</span>
          <input id="volumeInput" type="range" min="0" max="1" step="0.05">
          <output id="volumeValue"></output>
        </label>
      </section>

      <footer class="foot">
        <button id="importButton" class="secondary" type="button">Use Page Text</button>
        <span id="assetStatus">Assets unknown</span>
      </footer>
    </main>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
